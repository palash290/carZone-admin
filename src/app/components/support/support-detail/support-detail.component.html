<div class="main-content-wrapper">
    <div class="ct_top_heading_box">
        <div class="d-flex ct_flex_col_575 justify-content-between gap-2 align-items-center">
            <h4 class=""> <a routerLink="/home/support" class="me-1 ct_text_dark"><i
                        class="fa-solid fa-chevron-left"></i></a>Support Details</h4>
        </div>
    </div>
    <div class="ct_inner_header_bg ct_mt_50 mb-5 ct_px_28">
        <div class="">
            <div *ngIf="supportData" class="ct_mt_50 bg-white ct_border_radius_8 ct_box_shadow_25 ct_p_30 ct_576_p_20">
                <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap ct_mb_32">
                    <div class="d-flex flex-wrap gap-3 align-items-center">
                        <div>
                            <img [src]="supportData.profileImage || 'img/user-f.jpg'" onerror="this.src='img/user-f.jpg'" alt="" class="ct_img_60">
                        </div>
                        <div>
                            <h3 class="ct_fs_18 ct_fw_600 mb-0 text-break">{{ supportData.fullName }}</h3>
                            <p class="ct_text_para mb-0 text-break">{{ supportData.email }}</p>

                        </div>
                    </div>
                    <div class="">
                        <button class="btn-status text-capitalize" [ngClass]="{
                            'ct_approved': supportData.status === 'resolved',
                            'ct_pending': supportData.status === 'pending'
                        }">Status: {{ supportData.status }}</button>
                    </div>
                </div>

                <div class="mb-5">
                    <div class="ct_fw_500 ct_fs_16 mb-2">
                        <span class="ct_fw_600 ct_text_para">User Type:</span>
                        {{ supportData.account_type | titlecase }}
                    </div>
                    <div class="ct_fw_500 ct_fs_16">
                        <span class="ct_fw_600 ct_text_para">Issue:</span>
                        “{{ supportData.issue }}”
                    </div>
                </div>
                <div>
                    <div>
                        <label class="ct_form_label ct_fs_18 ct_fw_600 mb-3"> Your Response </label>
                        <textarea class="form-control ct_input" rows="3"
                            placeholder="Type your response here..." [(ngModel)]="adminResponse" [disabled]="supportData.status === 'resolved'"></textarea>
                    </div>
                    <div class="d-flex ct_flex_col_575 gap-3 mt-5 justify-content-end">
                        <a routerLink="/home/support" class="ct_transparent_btn ct_width_100_575 text-center text-decoration-none pt-2">Cancel</a>
                        <button *ngIf="supportData.status === 'pending'" (click)="resolveSupport()" class="ct_gradient_btn ct_width_100_575" [disabled]="loading">
                            {{ loading ? 'Processing...' : 'Answer and Resolve' }}
                        </button>
                    </div>
                </div>

            </div>
            <div *ngIf="!supportData && !loading" class="text-center mt-5">
                <p class="ct_fs_15">Support details not found</p>
                <a routerLink="/home/support" class="btn btn-primary mt-2">Back to Support</a>
            </div>
            <div *ngIf="loading" class="text-center mt-5">
                <p class="ct_fs_15">Loading...</p>
            </div>


            <!-- end -->
        </div>
    </div>
</div>
