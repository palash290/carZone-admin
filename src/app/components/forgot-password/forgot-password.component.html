<div class="login-wrapper">

    <!-- LEFT PANEL (hidden on mobile/tablet via Bootstrap + CSS) -->
    <div class="left-panel d-none d-lg-block">
        <!-- Using a high-quality red car placeholder via Unsplash -->
        <img class="car-img" src="img/login.png" alt="Red sports car" />
        <p class="tagline">Manage Smarter. Operate Seamlessly.<br>Everything in One Place</p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <div class="right-inner">
            <div class="form-area">

                <!-- Logo -->
                <div class="logo-wrap mb-5">
                    <img src="img/logo.jfif" alt="" class="">

                </div>
                <!-- Heading -->
                <h1 class="heading ct_fs_45 ct_fw_400 ct_font_cairo text-white mb-1">Forgot Password</h1>
                <p class="sub-heading text-white ct_fs_16 ct_mb_32">We've missed you! Please sign in to catch up<br
                        class="d-none d-sm-inline"> on what you've missed</p>
                <!-- Form -->
                <form [formGroup]="resetForm" class="">
                    <div class="ct_mb_32">
                        <label class="form-label mb-2 text-white" for="email">Email</label>
                        <input type="email" id="email" class="form-control ct_login_input"
                            placeholder="Enter your email" autocomplete="email" formControlName="email" />
                        <div *ngIf="resetForm.controls['email'].invalid && resetForm.controls['email'].touched"
                            class="err_msg">
                            <div *ngIf="resetForm.controls['email'].errors?.['required']">Email is required.
                            </div>
                            <div
                                *ngIf="resetForm.controls['email'].errors?.['email'] && !resetForm.controls['email'].errors?.['required']">
                                Invalid email format.
                            </div>
                        </div>
                    </div>
                </form>
                <button class="btn-signin" type="button"> Send Reset Link</button>
                <div class="text-start  ct_fs_14 text-white mt-3">
                    Already Know Your Password?
                    <a class="forgot-link  text-white ct_fw_600" routerLink="/">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
